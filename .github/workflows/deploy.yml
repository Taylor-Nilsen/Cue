# Build the site and publish it to cue.taylornilsen.com.
#
# Publishes by pushing the build to the gh-pages branch, which is the source
# Pages is actually reading. The alternative — the deploy-pages action — needs
# the repository's Pages source set to "GitHub Actions", and switching that is
# a settings change nobody should have to make to get a deploy working.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall vendors the OCR worker and downloads the English language
      # data, so the built site serves its own reader rather than a CDN's.
      - run: npm ci

      # A build that fails its tests never reaches the domain.
      - run: npm test

      - run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # The branch is a mirror of the current build, not a history — every
          # deploy replaces it, so 50 MB of wasm doesn't accumulate forever.
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
